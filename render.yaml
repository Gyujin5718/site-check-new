services:
  - type: web
    name: site-check
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_KAKAO_CLIENT_ID
        value: b1788a69ad40e17245ccac45a2f9cd12
      - key: REACT_APP_API_BASE_URL
        value: ""
